version: '3.8'
services:
  shard1:
    image: postgres:15
    container_name: pg-shard1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shard_db
    ports:
      - "5432:5432"
    volumes:
      - pg-shard1:/var/lib/postgresql/data
    networks:
      - shard-network
  shard2:
    image: postgres:15
    container_name: pg-shard2
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shard_db
    ports:
      - "5433:5432"
    volumes:
      - pg-shard2:/var/lib/postgresql/data
    networks:
      - shard-network
  shard3:
    image: postgres:15
    container_name: pg-shard3
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shard_db
    ports:
      - "5434:5432"
    volumes:
      - pg-shard3:/var/lib/postgresql/data
    networks:
      - shard-network
volumes:
  pg-shard1:
  pg-shard2:
  pg-shard3:
networks:
  shard-network:
    driver: bridge
